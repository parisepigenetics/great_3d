[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"


[project]
name = "great-3d"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
license = {text = 'LGPLv3'}
requires-python = ">=3.13"
dependencies = [
    "biopython>=1.85",
    "bottleneck>=1.6.0",
    "dash>=3.2.0",
    "dash-bootstrap-components>=2.0.4",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "scipy>=1.16.2",
]
